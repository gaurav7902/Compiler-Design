<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Compiler construction pipeline</title>
  <desc id="desc">Source code flows through lexical analysis, syntax analysis, semantic analysis, intermediate code, optimization, and target code.</desc>
  <rect width="960" height="600" fill="#111720"/>
  <g fill="none" stroke="#60a995" stroke-width="3">
    <path d="M136 170h60m100 0h60m100 0h60m100 0h60m100 0h60"/>
    <path d="M136 430h60m100 0h60m100 0h60m100 0h60m100 0h60"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g>
      <rect x="36" y="115" width="100" height="110" rx="8" fill="#176354"/>
      <text x="86" y="155" fill="#f2f6f2" font-size="16" font-weight="700">SOURCE</text>
      <text x="86" y="181" fill="#d8a747" font-size="14">code</text>
    </g>
    <g>
      <rect x="196" y="115" width="100" height="110" rx="8" fill="#28768b"/>
      <text x="246" y="155" fill="#f2f6f2" font-size="15" font-weight="700">LEXICAL</text>
      <text x="246" y="181" fill="#f2f6f2" font-size="13">tokens</text>
    </g>
    <g>
      <rect x="356" y="115" width="100" height="110" rx="8" fill="#176354"/>
      <text x="406" y="155" fill="#f2f6f2" font-size="15" font-weight="700">SYNTAX</text>
      <text x="406" y="181" fill="#f2f6f2" font-size="13">parse tree</text>
    </g>
    <g>
      <rect x="516" y="115" width="100" height="110" rx="8" fill="#28768b"/>
      <text x="566" y="155" fill="#f2f6f2" font-size="15" font-weight="700">SEMANTIC</text>
      <text x="566" y="181" fill="#f2f6f2" font-size="13">meaning</text>
    </g>
    <g>
      <rect x="676" y="115" width="100" height="110" rx="8" fill="#176354"/>
      <text x="726" y="155" fill="#f2f6f2" font-size="15" font-weight="700">INTERMEDIATE</text>
      <text x="726" y="181" fill="#f2f6f2" font-size="13">representation</text>
    </g>
    <g>
      <rect x="836" y="115" width="88" height="110" rx="8" fill="#c94f35"/>
      <text x="880" y="155" fill="#f2f6f2" font-size="14" font-weight="700">TARGET</text>
      <text x="880" y="181" fill="#f2f6f2" font-size="13">code</text>
    </g>
    <text x="480" y="335" fill="#d8a747" font-size="20" font-weight="700" letter-spacing="3">ANALYZE · TRANSFORM · GENERATE</text>
    <g fill="#f2f6f2" font-size="14">
      <text x="245" y="465">grammar</text>
      <text x="405" y="465">types</text>
      <text x="565" y="465">three-address code</text>
      <text x="725" y="465">optimization</text>
    </g>
    <path d="M246 430v-28h479v28" fill="none" stroke="#d8a747" stroke-width="2"/>
  </g>
</svg>
